[project]
name = "erpnext-connector"
version = "0.1.0"
description = "MCP-Connector zwischen OpenWebUI/Claude und ERPNext (REST-API)"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "mcp>=1.2.0",
    "httpx>=0.27.0",
    "python-dotenv>=1.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "ruff>=0.5.0",
]

[project.scripts]
erpnext-connector = "erpnext_connector.__main__:main"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/erpnext_connector"]

[tool.ruff]
line-length = 100
target-version = "py310"
