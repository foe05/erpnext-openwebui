# Reverse-Proxy-Snippet: mcpo hinter chat.broetzens.de unter dem Pfad /mcp/
#
# Bei Nginx Proxy Manager: Proxy Host "chat.broetzens.de" -> Tab "Advanced"
# -> "Custom Nginx Configuration" -> diesen location-Block einfügen.
#
# Wichtig: Der TRAILING SLASH hinter :8111/ strippt das /mcp/-Präfix, sodass
# .../mcp/erpnext/openapi.json beim mcpo als /erpnext/openapi.json ankommt.
#
# 172.17.0.1 = Host aus Container-Sicht (Docker-Standard-Bridge-Gateway).
# Passende IP notfalls: ip -4 addr show docker0 | grep -oP 'inet \K[\d.]+'

location /mcp/ {
    proxy_pass http://172.17.0.1:8111/;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
}

# Alternative (robuster, kein Rewrite): eigene Subdomain tools.broetzens.de
# als eigener NPM-Proxy-Host -> Forward auf 172.17.0.1:8111, TLS an.
# OpenWebUI-Tool-URL dann: https://tools.broetzens.de/erpnext
